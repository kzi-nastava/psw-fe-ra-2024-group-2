<div class="dialog-container">
    <div class="dialog-header">
        <h2 mat-dialog-title>Edit Bundle</h2>
    </div>

    <form [formGroup]="bundleForm" (ngSubmit)="onSubmit()" class="bundle-form">
        <mat-dialog-content>
            <div class="form-grid">
                <!-- Bundle Name (disabled) -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Bundle Name</mat-label>
                    <input matInput formControlName="name" [disabled]="true">
                    <mat-icon matPrefix>inventory_2</mat-icon>
                </mat-form-field>

                <!-- Price -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Price</mat-label>
                    <input matInput type="number" formControlName="price" placeholder="0.00">
                    <mat-error *ngIf="bundleForm.get('price')?.invalid">
                        {{ getErrorMessage('price') }}
                    </mat-error>
                </mat-form-field>

                <!-- Status -->
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Status</mat-label>
                    <mat-select formControlName="status">
                        <mat-option *ngFor="let status of statusOptions" [value]="status">
                            {{ status }}
                        </mat-option>
                    </mat-select>
                    <mat-icon matPrefix>flag</mat-icon>
                </mat-form-field>
            </div>
        </mat-dialog-content>

        <mat-dialog-actions align="end" class="dialog-actions">
            <button mat-button type="button" (click)="onCancel()" [disabled]="isSubmitting">
                Cancel
            </button>
            <button *ngIf="isPublishable()"  mat-stroked-button type="button" (click)="onPublish()" class="publish-button"
                [disabled]="!isPublishable() || isSubmitting">
                Publish
            </button>
            <button mat-raised-button color="primary" type="submit" [disabled]="!bundleForm.valid || isSubmitting">
                Save Changes
                <mat-icon *ngIf="isSubmitting" class="spinner">sync</mat-icon>
            </button>
        </mat-dialog-actions>
    </form>
</div>
