<h2 mat-dialog-title>Edit Souvenir</h2>
<mat-dialog-content>
    <div class="form-container">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Price</mat-label>
            <input matInput type="number" [(ngModel)]="data.price" min="0" step="0.01" placeholder="Enter price" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Stock</mat-label>
            <input matInput type="number" [(ngModel)]="data.count" min="0" placeholder="Enter stock count" />
        </mat-form-field>
        <div *ngIf="data.souvenirStatus != 1" class="publish-info">
            <p>This souvenir is not published. Click the "Publish" button to make it public.</p>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-stroked-button color="warn" (click)="onCancel()">Cancel</button>
    <button *ngIf="data.souvenirStatus != 1" mat-raised-button color="accent" (click)="onPublish()">
        Publish
    </button>
    <button mat-raised-button color="primary" (click)="onSave()">Save</button>
</mat-dialog-actions>
