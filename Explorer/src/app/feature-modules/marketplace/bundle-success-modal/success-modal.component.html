<div class="modal-container">
    <div class="modal-header">
        <h2 class="modal-title">Success!</h2>
        <button class="close-button" (click)="close()">×</button>
    </div>

    <div class="modal-content">
        <div class="success-icon">✓</div>
        <p class="success-message">Tour Bundle Created Successfully</p>
        <div class="bundle-details">
            <p><strong>Bundle Name:</strong> {{ data.bundle.name }}</p>
            <p><strong>Price:</strong> ${{ data.bundle.price }}</p>
            <p><strong>Number of Tours:</strong> {{ data.bundle.tours.length }}</p>
        </div>
    </div>

    <div class="modal-footer">
        <button class="close-btn" (click)="close()">Close</button>
    </div>
</div>
