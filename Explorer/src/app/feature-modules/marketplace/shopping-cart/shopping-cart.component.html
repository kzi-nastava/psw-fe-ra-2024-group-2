<div class="cart-wrapper" [class.open]="isOpen">
    <div class="cart-sidebar">
      <div class="cart-header">
        <h2>Shopping Cart</h2>
        <button class="close-btn" (click)="toggleCart()">×</button>
      </div>
  
      <div class="cart-items">
        <div *ngFor="let item of orderItems" class="cart-item">
          <div class="item-details">
            <h3>{{ item.tourName }}</h3>
            <p class="price">${{ item.price }}</p>
          </div>
          <button class="remove-btn" (click)="removeItem(item.tourId)">Remove</button>
        </div>
  
        <div *ngIf="orderItems.length === 0" class="empty-cart">
          Your cart is empty
        </div>
      </div>
  
      <div class="cart-footer">
        <div class="total">
          <span>Total:</span>
          <span class="total-price">${{ totalPrice }}</span>
        </div>
        <button 
          class="checkout-btn" 
          (click)="checkout()" 
          [disabled]="orderItems.length === 0">
          Checkout
        </button>
      </div>
    </div>
  </div>
