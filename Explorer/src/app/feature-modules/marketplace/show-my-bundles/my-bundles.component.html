<div class="bundles-container">
    <header class="page-header">
        <h1>My Tour Bundles</h1>
        <p class="subtitle">Manage your created tour packages</p>
    </header>

    <div class="bundles-grid">
        <mat-card *ngFor="let bundle of bundles" class="bundle-card">
            <div class="bundle-actions-overlay">
                <button mat-icon-button color="primary" (click)="openEditDialog(bundle)" class="action-button edit">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="openDeleteDialog(bundle)" class="action-button delete">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>

            <mat-card-header>
                <mat-card-title>{{ bundle.name }}</mat-card-title>
                <mat-card-subtitle>
                    <span class="status-badge" [style.background-color]="getStatusColor(bundle.status)">
                        {{ getStatusLabel(bundle.status) }}
                    </span>
                </mat-card-subtitle>
            </mat-card-header>

            <mat-card-content>
                <div class="price-section">
                    <span class="price-label">Bundle Price</span>
                    <span class="price-value">{{ bundle.price | currency }}</span>
                </div>

                <div class="tours-section">
                    <h3>Included Tours</h3>
                    <div class="tour-list">
                        <div *ngFor="let tour of bundle.tours" class="tour-item">
                            <span class="tour-id">Tour #{{ tour.tourId }}</span>
                            <span class="tour-price">{{ tour.price | currency }}</span>
                        </div>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>
    </div>

    <div *ngIf="isLoading" class="loading-spinner">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="!isLoading && bundles.length === 0" class="empty-state">
        <mat-icon>inventory</mat-icon>
        <h2>No Bundles Found</h2>
        <p>Start creating your first tour bundle!</p>
    </div>
</div>
