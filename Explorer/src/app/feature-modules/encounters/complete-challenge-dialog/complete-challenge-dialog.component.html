<div class="dialog-content">
  <h1>Challenge</h1>
  <div *ngIf="data.encounterType === 'Social'; else miscContent">
    <p>You entered a social encounter!</p>
    <button (click)="onCancel()">Cancel</button>
  </div>
  <ng-template #miscContent>
    <div>
      <p>Are you ready to complete the challenge?</p>
    </div>
    <div>
      <button (click)="onCancel()">Cancel</button>
      <button (click)="completeChallenge()">Complete Challenge</button>
    </div>
  </ng-template>
</div>
