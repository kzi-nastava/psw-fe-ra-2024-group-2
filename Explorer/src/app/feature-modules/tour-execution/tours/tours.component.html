<div class="container">
  <!-- Search button -->
  <div class="search-container">
    <button class="search-button" (click)="gotoTourSearch()">
      <span class="icon">🔍</span>
      Search Tours
    </button>
  </div>
   
  <!-- Tours grid -->
  <div class="row">
    <div class="col-4" *ngFor="let tour of tours">
      <div class="tour-card" *ngIf="tour.status !== 2">
        <!-- Card header -->
        <div class="tour-header">
          <h3 class="tour-title">{{ tour.name }}</h3>
          <div class="tour-meta">
            <div class="badge-container">
              <span class="badge" [ngClass]="'badge-difficulty-' + tour.difficulty">
                <span class="icon">⚡</span>
                {{ getDifficultyLabel(tour.difficulty) }}
              </span>
            </div>
            <div class="badge-container">
              <span class="badge" [ngClass]="'badge-status-' + tour.status">
                <span class="icon">●</span>
                {{ getStatusLabel(tour.status) }}
              </span>
            </div>
          </div>
        </div>
         
        <!-- Card content -->
        <div class="tour-content">
          <div class="tour-price">
            <div class="price-amount">
              <svg class="coin-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="currentColor"/>
                <path d="M12 6C9.79 6 8 7.79 8 10H10C10 8.9 10.9 8 12 8C13.1 8 14 8.9 14 10C14 12 11 12.75 11 16H13C13 13.75 16 13 16 10C16 7.79 14.21 6 12 6Z" fill="currentColor"/>
                <rect x="11" y="17" width="2" height="2" fill="currentColor"/>
              </svg>
              {{ tour.price }}
            </div>
            <div class="price-label">per person</div>
          </div>
           
          <div class="tour-description">
            {{ tour.description }}
          </div>
           
          <div *ngIf="tour.equipment.length > 0" class="tour-equipment">
            <div class="section-title">
              <span class="icon">⚒</span>
              Included Equipment
            </div>
            <div class="equipment-list">
              <div class="equipment-item" *ngFor="let equipmentId of tour.equipment">
                <span class="icon">✓</span>
                {{ equipmentId }}
              </div>
            </div>
          </div>
        </div>
        
        <!-- Card actions -->
        <div class="tour-actions">
          <button class="btn btn-primary" (click)="showReviews(tour.id)">
            <span class="icon">★</span>
            Reviews
          </button>
          <button class="btn btn-accent" (click)="addToCart(tour.id)">
            <span class="icon">🛒</span>
            Add to Cart
          </button>
          <button class="btn btn-secondary" (click)="onViewDetails(tour.id)">
            <span class="icon">👁</span>
            View Details
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shopping cart component -->
  <xp-shopping-cart></xp-shopping-cart>
</div>
