<div class="container">
  <div class="mb-4">
    <button class="btn btn-primary" (click)="gotoTourSearch()">
      <span class="icon">🔍</span>
      Search Tours
    </button>
  </div>
   
  <div class="row">
    <div class="col-4" *ngFor="let tour of tours">
      <div class="tour-card" *ngIf="tour.status !== 2">
        <div class="tour-header">
          <h3 class="tour-title">{{ tour.name }}</h3>
          <div class="tour-meta">
            <div class="badge-container">
              <span class="badge" [ngClass]="'badge-difficulty-' + tour.difficulty">
                <span class="icon">⚡</span>
                {{ getDifficultyLabel(tour.difficulty) }}
              </span>
            </div>
            <div class="badge-container">
              <span class="badge" [ngClass]="'badge-status-' + tour.status">
                <span class="icon">●</span>
                {{ getStatusLabel(tour.status) }}
              </span>
            </div>
          </div>
        </div>
         
        <div class="tour-content">
          <div class="tour-price">
            <div class="price-amount"><i class="bi bi-coin"></i> {{ tour.price }}</div>
            <div class="price-label">per person</div>
          </div>
           
          <div class="tour-description">
            {{ tour.description }}
          </div>
           
          <div *ngIf="tour.equipment.length > 0" class="tour-equipment">
            <div class="section-title">
              <span class="icon">⚒</span>
              Included Equipment
            </div>
            <div class="equipment-list">
              <div class="equipment-item" *ngFor="let equipmentId of tour.equipment">
                <span class="icon">✓</span>
                {{ equipmentId }}
              </div>
            </div>
          </div>
        </div>
        
        <div class="tour-actions">
          <button class="btn btn-primary" (click)="showReviews(tour.id)">
            <span class="icon">★</span>
            Reviews
          </button>
          <button class="btn btn-accent" (click)="addToCart(tour.id)">
            <span class="icon">🛒</span>
            Add to Cart
          </button>
          <!-- New View Details button -->
          <button class="btn btn-secondary" (click)="onViewDetails(tour.id)">
            <span class="icon">👁</span>
            View Details
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<xp-shopping-cart></xp-shopping-cart>
