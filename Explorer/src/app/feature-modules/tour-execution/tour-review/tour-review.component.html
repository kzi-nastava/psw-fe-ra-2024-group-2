<div class="mat-card review-container" *ngFor="let review of reviews">
  <!-- Review Header Section -->
  <div class="mat-card-header">
    <div class="review-header-content">
      <h3 class="mat-card-title">
        User {{ review.userId }}
        <span class="rating-badge">
          {{ review.grade }}/5
        </span>
      </h3>
      <div class="mat-card-subtitle review-dates">
        <span class="date-item">
          <i class="material-icons">rate_review</i>
          Reviewed {{ review.reviewDate | date: 'longDate' }}
        </span>
        <span class="date-item">
          <i class="material-icons">event</i>
          Visited {{ review.visitDate | date: 'longDate' }}
        </span>
      </div>
    </div>
  </div>

  <!-- Review Content Section -->
  <div class="mat-card-content">
    <p class="review-comment">{{ review.comment }}</p>
    
    <!-- Image Section -->
    <!-- <div class="review-image-container" *ngIf="review.image">
      <img [src]="review.image.url" [alt]="review.image.altText" class="review-image" />
    </div> -->
  </div>
</div>
