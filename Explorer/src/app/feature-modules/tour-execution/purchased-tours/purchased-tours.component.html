<div class="container">
  <!-- Empty state message -->
  <div class="page-title">Purchased Tours</div>
  
  <div *ngIf="tours.length === 0" class="empty-state">
    You haven't purchased any tours yet.
  </div>

  <!-- Tours grid -->
  <div class="row" *ngIf="tours.length > 0">
    <div class="col-4" *ngFor="let tour of tours">
      <div class="tour-card">
        <div class="tour-header">
          <h3 class="tour-title">{{ tour.name }}</h3>
          <div class="tour-meta">
            <div class="badge-container">
              <span class="badge" [ngClass]="'badge-difficulty-' + tour.difficulty">
                <span class="icon">⚡</span>
                {{ getDifficultyLabel(tour.difficulty) }}
              </span>
            </div>
            <div class="badge-container">
              <span class="badge" [ngClass]="'badge-status-' + tour.status">
                <span class="icon">●</span>
                {{ getStatusLabel(tour.status) }}
              </span>
            </div>
          </div>
        </div>
        
        <div class="tour-content">
          <div class="tour-description">
            {{ tour.description }}
          </div>
          
          <div *ngIf="tour.equipment.length > 0" class="tour-equipment">
            <div class="section-title">
              <span class="icon">⚒</span>
              Included Equipment
            </div>
            <div class="equipment-list">
              <div class="equipment-item" *ngFor="let equipmentId of tour.equipment">
                <span class="icon">✓</span>
                {{ equipmentId }}
              </div>
            </div>
          </div>
          
          <div class="tour-duration" *ngFor="let duration of tour.tourDurationByTransportDtos">
            <span class="icon">⏱</span>
            Duration ({{ duration.transport }}): {{ formatDuration(duration.duration) }}
          </div>
        </div>
        
        <div class="tour-actions">
          <button class="btn btn-accent" (click)="goToReviewForm(tour.id)">
            Write Review
          </button>
          <button class="btn btn-primary" (click)="showReviews(tour.id)">
            Reviews
          </button>
          <button class="btn btn-accent" (click)="startTour(tour.id)">
            Start Tour
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
