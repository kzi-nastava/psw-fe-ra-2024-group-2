<form [formGroup]="tourReviewForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="grade">Grade (1-5):</label>
    <input id="grade" type="number" formControlName="grade" min="1" max="5" required>
    <div *ngIf="isFieldInvalid('grade')">
      <small>Grade is required and must be between 1 and 5.</small>
    </div>
  </div>

  <div>
    <label for="comment">Comment:</label>
    <textarea id="comment" formControlName="comment" required></textarea>
    <div *ngIf="isFieldInvalid('comment')">
      <small>Comment is required.</small>
    </div>
  </div>

  <div>
    <label for="reviewDate">Review Date:</label>
    <input id="reviewDate" type="date" formControlName="reviewDate" required>
    <div *ngIf="isFieldInvalid('reviewDate')">
      <small>Review date is required.</small>
    </div>
  </div>

  <div>
    <label for="visitDate">Visit Date:</label>
    <input id="visitDate" type="date" formControlName="visitDate" required>
    <div *ngIf="isFieldInvalid('visitDate')">
      <small>Visit date is required.</small>
    </div>
  </div>

  <!-- File Input for Image -->
  <div>
    <label for="image-upload">Upload Image:</label>
    <input type="file" id="image-upload" (change)="onFileSelect($event)">
  </div>

  <!-- Image Preview -->
  <div *ngIf="imagePreview" class="image-preview-container">
    <label>Image Preview:</label>
    <img [src]="imagePreview" alt="Image Preview" class="image-preview" />
  </div>

  <!-- Hidden fields for userId and tourId -->
  <input type="hidden" formControlName="userId">
  <input type="hidden" formControlName="tourId">

  <button type="submit">Submit Review</button>
</form>
