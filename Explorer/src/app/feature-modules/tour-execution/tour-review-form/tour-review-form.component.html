<div class="container">
  <div class="review-form-container">
    <div class="form-header">
      <h2 class="form-title">Write Your Review</h2>
    </div>

    <form [formGroup]="tourReviewForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="grade">
          <span class="icon">★</span> Grade (1-5)
        </label>
        <input 
          id="grade" 
          type="number" 
          class="form-control" 
          [ngClass]="{'error': isFieldInvalid('grade')}"
          formControlName="grade" 
          min="1" 
          max="5" 
          required
        >
        <div class="error-message" *ngIf="isFieldInvalid('grade')">
          <span class="icon">⚠</span>
          <small>Grade is required and must be between 1 and 5</small>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="comment">
          <span class="icon">✎</span> Comment
        </label>
        <textarea 
          id="comment" 
          class="form-control"
          [ngClass]="{'error': isFieldInvalid('comment')}"
          formControlName="comment" 
          required
        ></textarea>
        <div class="error-message" *ngIf="isFieldInvalid('comment')">
          <span class="icon">⚠</span>
          <small>Comment is required</small>
        </div>
      </div>

      <div class="date-fields-container">
        <div class="form-group">
          <label class="form-label" for="reviewDate">
            <span class="icon">📅</span> Review Date
          </label>
          <input 
            id="reviewDate" 
            type="date" 
            class="form-control"
            [ngClass]="{'error': isFieldInvalid('reviewDate')}"
            formControlName="reviewDate" 
            required
          >
          <div class="error-message" *ngIf="isFieldInvalid('reviewDate')">
            <span class="icon">⚠</span>
            <small>Review date is required</small>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="visitDate">
            <span class="icon">🗓</span> Visit Date
          </label>
          <input 
            id="visitDate" 
            type="date" 
            class="form-control"
            [ngClass]="{'error': isFieldInvalid('visitDate')}"
            formControlName="visitDate" 
            required
          >
          <div class="error-message" *ngIf="isFieldInvalid('visitDate')">
            <span class="icon">⚠</span>
            <small>Visit date is required</small>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <span class="icon">📷</span> Upload Image
        </label>
        <div class="file-upload">
          <label class="file-input-label">
            <span class="icon">📤</span>
            Choose File
            <input 
              type="file" 
              id="image-upload" 
              accept="image/*"
              (change)="onFileSelect($event)"
            >
          </label>
        </div>

        <div *ngIf="imagePreview" class="image-preview-container">
          <label class="form-label">Image Preview</label>
          <img [src]="imagePreview" alt="Image Preview" class="image-preview">
        </div>
      </div>

      <!-- Hidden fields -->
      <input type="hidden" formControlName="userId">
      <input type="hidden" formControlName="tourId">

      <div class="form-actions">
        <button 
          type="submit" 
          class="btn-submit"
          [disabled]="tourReviewForm.invalid"
        >
          <span class="icon">✓</span>
          Submit Review
        </button>
      </div>
    </form>
  </div>
</div>
