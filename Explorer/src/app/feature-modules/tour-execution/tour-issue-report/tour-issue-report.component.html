<div class="tour-table-container">
    <table>
        <thead>
            <tr>
                <th>Tour</th>
                <th>Category</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Created At</th>
                <th>Fix Until</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let rp of tourIssueReportName"
            (click)="checkReport(rp)" >
                <td>{{rp.tourName}}</td>
                <td>{{rp.category}}</td>
                <td>{{rp.description}}</td>
                <td [ngClass]="{
                    'priority-high': rp.priority === 'High',
                    'priority-medium': rp.priority === 'Medium',
                    'priority-low': rp.priority === 'Low'
                }">{{rp.priority}}</td>
                <td>{{rp.createdAt | date:'dd-MMM-yyyy HH:mm'}}</td>
                <td>{{rp.fixUntil | date:'dd-MMM-yyyy HH:mm'}}</td>
                <td>{{getStatus(rp.status)}}</td>
            </tr>
        </tbody>
    </table>
</div>
