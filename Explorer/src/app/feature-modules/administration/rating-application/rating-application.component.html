<div id="rating-application">
    <p id="title">All ratings of application</p>
    <hr>
    <div id="rating-application-details">
        <div *ngFor="let ra of ratingWithUser" class="rating-card">
            <div class="card-header">
                <h3>Username: {{ ra.account.username }}</h3>
                <div class="rating-icon">{{ '⭐'.repeat(ra.ratingApplication.grade) }}</div>
            </div>
            <div class="card-content">
                <p class="comment">
                    <i *ngIf="ra.ratingApplication.comment; else noComment">"{{ ra.ratingApplication.comment }}"</i>
                    <ng-template #noComment><strong>Korisnik nije ostavio komentar!</strong></ng-template>
                </p>          
                      <p><strong>Rated on:</strong> {{ ra.ratingApplication.ratingTime ? (ra.ratingApplication.ratingTime | date:'dd/MM/yyyy HH:mm') : 'N/A' }}</p>
            </div>
        </div>
    </div>
</div>
