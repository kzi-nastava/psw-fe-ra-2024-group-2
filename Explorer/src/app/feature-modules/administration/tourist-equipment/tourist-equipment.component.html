<div class="equipment-container">
    <div class="equipment-card">
        <div class="card-header">
            <h2>Equipment Management</h2>
        </div>
        <div class="card-content">
            <div class="equipment-grid">
                <!-- Assigned Equipment Section -->
                <div class="equipment-section">
                    <h3>Assigned Equipment</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let eq of touristEquipment" (click)="selectEquipment(eq)">
                                    <td>{{ eq.name }}</td>
                                    <td>{{ eq.description }}</td>
                                    <td>
                                        <button class="icon-button" (click)="removeEquipment()">
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Available Equipment Section -->
                <div class="equipment-section">
                    <h3>Available Equipment</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let eq of availableEquipment" (click)="selectAvailableEquipment(eq)">
                                    <td>{{ eq.name }}</td>
                                    <td>{{ eq.description }}</td>
                                    <td>
                                        <button class="icon-button" (click)="addEquipment()">
                                            <mat-icon>add</mat-icon>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div *ngIf="message" class="notification">
                {{ message }}
            </div>
        </div>
    </div>
</div>
