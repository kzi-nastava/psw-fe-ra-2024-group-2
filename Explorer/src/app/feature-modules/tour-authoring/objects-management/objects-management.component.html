<div class="component">
    <div class="container">
      <div class="table-section">
        <div class="table-header">
          <h2 class="table-title">Objects List</h2>
          <div class="table-actions">
            <div class="search-container">
              <input type="text" placeholder="Search objects..." class="search-input">
              <i class="fas fa-search search-icon"></i>
            </div>
          </div>
        </div>
        
        <div class="table-container">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Image</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let objek of objects" class="table-row">
                <td class="name-cell">{{objek.name}}</td>
                <td class="description-cell">
                  <div class="description-content">{{objek.description}}</div>
                </td>
                <td class="category-cell">
                  <span class="category-badge">
                    {{ objek.category }}
                  </span>
                </td>
                <td class="image-cell">
                  <div class="image-container" *ngIf="objek.image?.data">
                    <img [src]="'data:' + objek.image?.mimeType + ';base64,' + objek.image?.data" 
                         alt="Object Image" 
                         class="object-image">
                  </div>
                  <div class="no-image" *ngIf="!objek.image?.data">
                    <i class="fas fa-image"></i>
                  </div>
                </td>
                <td class="actions-cell">
                  <button class="btn btn-icon btn-edit" (click)="editObject(objek)" title="Edit object">
                    Edit object
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
