<!-- location-modal.component.html -->
<div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <div class="header-content">
        <i class="material-icons location-icon">location_on</i>
        <h2>Update Location</h2>
      </div>
    </div>

    <div class="modal-body">
      <form [formGroup]="updateForm" (ngSubmit)="updateObject()">
        <div class="form-group">
          <label for="latitude">Latitude</label>
          <input id="latitude" type="text" formControlName="latitude" [value]="latitude" readonly />
        </div>

        <div class="form-group">
          <label for="longitude">Longitude</label>
          <input id="longitude" type="text" formControlName="longitude" [value]="longitude" readonly />
        </div>

        <div class="map-container">
          <xp-map (locationSelected)="onLocationSelected($event)"></xp-map>
        </div>

        <div class="button-container">
          <button type="submit" [disabled]="updateForm.invalid" (click)="onSubmit()" class="submit-button">
            Update Location
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
