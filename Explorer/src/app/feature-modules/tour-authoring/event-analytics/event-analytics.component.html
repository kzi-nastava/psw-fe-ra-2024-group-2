<div class="component">
    <div class="container">
        <div class="table-section">
            <div class="table-title">
                Events Popularity
            </div>
            <div class="table-description">
                This section showcases the most popular events based on the number of acceptances. The top event is highlighted with a trophy icon!
            </div>
            <div class="cards-container">
                <div *ngFor="let ev of events; let i = index" class="event-card">
                    <div class="card-header">
                        <h3>{{ ev.name }}</h3>
                        <i *ngIf="i === 0" class="fa fa-trophy trophy-icon" aria-hidden="true"></i>
                    </div>
                    <div class="card-body">
                        <p class="description">{{ ev.description }}</p>
                        <p class="category">Category: <strong>{{ ev.category }}</strong></p>
                        <img 
                            *ngIf="ev.image?.data" 
                            [src]="'data:' + ev.image?.mimeType + ';base64,' + ev.image?.data" 
                            alt="Event Image" 
                            class="event-image">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
