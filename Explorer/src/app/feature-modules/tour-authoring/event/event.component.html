    <div class="container">
      <div class="table-section">
        <!-- Title Section -->
        <div class="table-title">
          Events
        </div>
  
        <!-- User-Friendly Description -->
        <div class="table-description">
          <p>
            Events that may be interseting for tourists are listed below, you can create new ones!
          </p>
        </div>
  
        <!-- Card Layout for Events -->
        <div class="card-container">
          <div class="card" *ngFor="let ev of events">
            <div class="card-image">
              <img
                *ngIf="ev.image?.data"
                [src]="'data:' + ev.image?.mimeType + ';base64,' + ev.image?.data"
                alt="{{ ev.name }}"
              />
              <div class="no-image" *ngIf="!ev.image?.data">
                <i class="fas fa-image"></i>
              </div>
            </div>
            <div class="card-content">
              <h3 class="card-title">{{ ev.name }}</h3>
              <p class="card-description">{{ ev.description }}</p>
              <span class="category-badge category-{{ ev.category }}">
                {{ ev.category }}
              </span>
            </div>
            <div class="card-content" style="display: flex; justify-content: space-around;">
              <button mat-raised-button color="primary" (click)="updateOverlay(ev)">Update</button>
              <button  mat-raised-button color="primary" (click)="deleteOverlay(ev)">Delete</button>
            </div>
          </div>
        </div>
      </div>

      <div class="overlay" *ngIf="deleteButtonDialog">
        <div class="confirmation-dialog">
          <h2>Confirm Deletion</h2>
          <p>Are you sure you want to delete this event?</p>
          <div class="dialog-actions">
            <button mat-raised-button color="primary" (click)="confirmDelete()">Confirm</button>
            <button mat-raised-button color="primary" (click)="cancelDelete()">Cancel</button>
          </div>
        </div>
      </div>

      <div class = "overlay" *ngIf="updateButtonDialog">
       <div class = "updateForm-diaog">
        <xp-update-form [event]="selectedEvent" (cancelUpdate)="onCancelUpdate()" 
        (eventUpdated)="refreshEvents()"></xp-update-form>
       </div>
      </div>
    </div>
