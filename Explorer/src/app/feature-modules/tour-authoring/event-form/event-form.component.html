<div class="page-wrapper">
  <div class="form-wrapper">
    <!-- Stepper Header -->
    <div class="step-indicator">
      <div
        class="step"
        *ngFor="let step of steps; let i = index"
        [class.active]="i === currentStep"
        [class.completed]="i < currentStep"
      >
        <div class="circle">{{ i + 1 }}</div>
        <div class="label">{{ step }}</div>
      </div>
    </div>

    <!-- Forma -->
    <form [formGroup]="eventForm" (ngSubmit)="addEvent()">

      <!-- Stepper Content -->
      <ng-container [ngSwitch]="currentStep">

        <!-- Step 1: Basic Info -->
        <div *ngSwitchCase="0" class="form-section">
          <h3 class="section-title">Basic Information</h3>
          <div class="form-grid">
            <!-- Name -->
            <div class="form-group">
              <label for="name" class="required">Name</label>
              <div class="input-container">
                <input id="name" formControlName="name" class="form-control" placeholder="Event name" />
                <div class="input-icon"><i class="fas fa-cube"></i></div>
              </div>
            </div>

            <!-- Category -->
            <div class="form-group">
              <label for="category" class="required">Category</label>
              <div class="input-container">
                <select id="category" formControlName="category" class="form-control">
                  <option value="">Select category</option>
                  <option value="0">Concert</option>
                  <option value="1">Music Festival</option>
                  <option value="2">Film Festival</option>
                  <option value="3">Football Match</option>
                  <option value="4">Basketball Match</option>
                </select>
                <div class="input-icon"><i class="fas fa-tag"></i></div>
              </div>
            </div>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label for="description" class="required">Description</label>
            <textarea id="description" formControlName="description" class="form-control" rows="4"
              placeholder="Detailed description"></textarea>
          </div>
        </div>

        <!-- Step 2: Upload Image -->
        <div *ngSwitchCase="1" class="form-section">
          <h3 class="section-title">Upload Image</h3>
          <div class="form-group">
            <label for="image-upload" class="file-upload-label">
              <i class="fas fa-cloud-upload-alt"></i>
              <span>Upload Image</span>
              <input type="file" id="image-upload" (change)="onFileSelect($event)" class="file-input" accept="image/*" />
            </label>
          </div>

          <div *ngIf="imagePreview" class="image-preview-container">
            <div class="preview-wrapper">
              <img [src]="imagePreview" class="image-preview" />
            </div>
          </div>
        </div>

        <!-- Step 3: Date -->
        <div *ngSwitchCase="2" class="form-section">
          <h3 class="section-title">Event Dates</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="startDate" class="required">Start Date</label>
              <input type="date" id="startDate" formControlName="startDate" class="form-control" />
            </div>

            <div class="form-group">
              <label for="endDate" class="required">End Date</label>
              <input type="date" id="endDate" formControlName="endDate" class="form-control" />
            </div>
          </div>
        </div>

        <!-- Step 4: Location -->
        <div *ngSwitchCase="3" class="form-section">
          <h3 class="section-title">Select Location</h3>
          <div class="coordinates-grid">
            <div class="form-group">
              <label for="latitude" class="required">Latitude</label>
              <div class="input-container">
                <input id="latitude" formControlName="latitude" class="form-control" readonly />
                <div class="input-icon"><i class="fas fa-map-marker-alt"></i></div>
              </div>
            </div>

            <div class="form-group">
              <label for="longitude" class="required">Longitude</label>
              <div class="input-container">
                <input id="longitude" formControlName="longitude" class="form-control" readonly />
                <div class="input-icon"><i class="fas fa-map-marker-alt"></i></div>
              </div>
            </div>
          </div>

          <div class="map-container">
            <xp-map 
              (locationSelected)="onLocationSelected($event)" 
              [clearMarkersTrigger]="clearMarkersFlag"
              (markersCleared)="onMarkersCleared()">
            </xp-map>
          </div>
        </div>

        <!-- Step 5: Review -->
        <div *ngSwitchCase="4" class="form-section">
          <h3 class="section-title">Review & Submit</h3>
          <p>Review all event details. If everything looks correct, click submit.</p>
        </div>

      </ng-container>

      <!-- Step Navigation -->
      <div class="form-actions">
        <button 
          type="button" 
          class="btn btn-secondary" 
          (click)="prevStep()" 
          [disabled]="currentStep === 0">
          <i class="fas fa-arrow-left"></i> Back
        </button>

        <button 
          type="button" 
          class="btn btn-primary" 
          *ngIf="currentStep < steps.length - 1" 
          (click)="nextStep()">
          Next <i class="fas fa-arrow-right"></i>
        </button>

        <button 
          type="submit" 
          class="btn btn-primary" 
          *ngIf="currentStep === steps.length - 1" 
          (click)="clearMarkers()">
          Submit <i class="fas fa-check"></i>
        </button>
      </div>

      <!-- Error Message -->
      <div *ngIf="showErrorMessage" class="error-message">
        Image already exists!
      </div>

    </form>
  </div>
</div>
