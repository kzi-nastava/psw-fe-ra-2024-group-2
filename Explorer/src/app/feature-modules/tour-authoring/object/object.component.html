<div class="component">
    <div class="container">
      <div class="table-section">
        <!-- Title Section -->
        <div class="table-title">
          Objects
        </div>
  
        <!-- User-Friendly Description -->
        <div class="table-description">
          <p>
            Here you can add objects that will be useful for tourists when doing their solo tours.
          </p>
        </div>
  
        <!-- Card Layout for Objects -->
        <div class="card-container">
          <div class="card" *ngFor="let objek of objects">
            <div class="card-image">
              <img
                *ngIf="objek.image?.data"
                [src]="'data:' + objek.image?.mimeType + ';base64,' + objek.image?.data"
                alt="{{ objek.name }}"
              />
              <div class="no-image" *ngIf="!objek.image?.data">
                <i class="fas fa-image"></i>
              </div>
            </div>
            <div class="card-content">
              <h3 class="card-title">{{ objek.name }}</h3>
              <p class="card-description">{{ objek.description }}</p>
              <span class="category-badge category-{{ objek.category }}">
                {{ objek.category }}
              </span>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Form Section -->
      <div class="form-section">
        <xp-object-form (objectAdded)="getObjects()"></xp-object-form>
      </div>
    </div>
  </div>
