<div class="page-container">
  <!-- Tours Table Section -->
  <section class="content-section">
    <div class="table-container">
      <h2 class="section-title">Available Tours</h2>
      <div class="table-wrapper">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th>Difficulty</th>
              <th>Status</th>
              <th>Tag</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let tour of tours" 
                (click)="showTourClick(tour)" 
                class="interactive-row">
              <td>{{ tour.name }}</td>
              <td>{{ tour.description }}</td>
              <td>
                <span class="badge" [ngClass]="'difficulty-' + tour.difficulty">
                  {{ getDifficultyLabel(tour.difficulty) }}
                </span>
              </td>
              <td>
                <span class="badge" [ngClass]="'status-' + tour.status">
                  {{ getStatusLabel(tour.status) }}
                </span>
              </td>
              <td>
                <span class="badge" [ngClass]="'tag-' + tour.tag">
                  {{ getTagLabel(tour.tag) }}
                </span>
              </td>
              <td class="price-column">{{ tour.price }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
