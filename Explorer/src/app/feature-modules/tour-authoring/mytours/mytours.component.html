<div class="card-grid">
  <!-- Kartice za ture -->
  <div class="card" *ngFor="let tour of tours">
    <!-- Header kartice -->
    <div class="card-header">
      <h3 class="card-title">{{ tour.name }}</h3>
      <div class="card-meta">
        <!-- Težina ture -->
        <span class="badge" [ngClass]="'badge-difficulty-' + tour.difficulty">
          {{ getDifficultyLabel(tour.difficulty) }}
        </span>
        <!-- Status ture -->
        <span class="badge" [ngClass]="'badge-status-' + tour.status">
          {{ getStatusLabel(tour.status) }}
        </span>
        <!-- Tag ture -->
        <span class="badge" [ngClass]="'badge-tag-' + tour.tag">
          {{ getTagLabel(tour.tag) }}
        </span>
      </div>
    </div>

    <!-- Sadržaj kartice -->
    <div class="card-body">
      <p class="card-description">{{ tour.description }}</p>
      <div class="card-price">
        <span class="price">${{ tour.price }}</span> per person
      </div>
      <!-- Prikaz kontrolnih tačaka ako postoje -->
      <!-- <div *ngIf="tour.checkpoints.length > 0" class="card-checkpoints">
        <h4>Checkpoints:</h4>
        <ul>
          <li *ngFor="let checkpoint of tour.checkpoints">
            Checkpoint ID: {{ checkpoint }}
          </li>
        </ul>
      </div> -->
    </div>

    <!-- Footer kartice -->
    <div class="card-footer">
      <button class="btn btn-primary" (click)="showTourClick(tour)">
        View Details
      </button>
    </div>
  </div>
</div>
