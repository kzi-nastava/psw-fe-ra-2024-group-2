<div class="form-container" style="max-width: 800px; margin: 0 auto;">
  <form [formGroup]="updateForm" (ngSubmit)="updateEvent()">
    <div class="form-header">
      <h2>Update Event</h2>
      <p class="form-subtitle">Update the details of the event below</p>
    </div>

    <div class="form-section">
      <h3 class="section-title">Basic Information</h3>
      <div class="form-grid" style="grid-template-columns: repeat(3, 1fr);">
        <!-- Name Field -->
        <div class="form-group">
          <label for="name" class="required">Name</label>
          <div class="input-container">
            <input id="name" formControlName="name" type="text" class="form-control" placeholder="Enter event name" />
          </div>
          <div *ngIf="updateForm.get('name')?.invalid && updateForm.get('name')?.touched" class="error-container">
            <small class="error"><i class="fas fa-exclamation-circle"></i> Name is required</small>
          </div>
        </div>

        <!-- Category Dropdown -->
        <div class="form-group">
          <label for="category" class="required">Category</label>
          <div class="input-container">
            <select id="category" formControlName="category" class="form-control">
              <option value="">Select a category</option>
              <option value="0">Concert</option>
              <option value="1">MusicFestival</option>
              <option value="2">FilmFestival</option>
              <option value="3">FootballMatch</option>
              <option value="4">BasketballMatch</option>
            </select>
          </div>
          <div *ngIf="updateForm.get('category')?.invalid && updateForm.get('category')?.touched" class="error-container">
            <small class="error"><i class="fas fa-exclamation-circle"></i> Category is required</small>
          </div>
        </div>

        <!-- Start Date Field -->
        <div class="form-group">
          <label for="startDate" class="required">Start Date</label>
          <div class="input-container">
            <input id="startDate" type="date" formControlName="startDate" class="form-control" />
            <div class="input-icon">
              <i class="fas fa-calendar-alt"></i>
            </div>
          </div>
          <div *ngIf="updateForm.get('startDate')?.invalid && updateForm.get('startDate')?.touched" class="error-container">
            <small class="error"><i class="fas fa-exclamation-circle"></i> Start Date is required</small>
          </div>
        </div>

        <!-- Description Field -->
        <div class="form-group" style="grid-column: span 2;">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description" rows="4" class="form-control" placeholder="Enter detailed description of the event"></textarea>
        </div>

        <!-- End Date Field -->
        <div class="form-group">
          <label for="endDate" class="required">End Date</label>
          <div class="input-container">
            <input id="endDate" type="date" formControlName="endDate" class="form-control" />
            <div class="input-icon">
              <i class="fas fa-calendar-check"></i>
            </div>
          </div>
          <div *ngIf="updateForm.get('endDate')?.invalid && updateForm.get('endDate')?.touched" class="error-container">
            <small class="error"><i class="fas fa-exclamation-circle"></i> End Date is required</small>
          </div>
        </div>        
      </div>
    </div>
    <!-- Submit and Cancel Buttons -->
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" (click)="updateEvent()">
        Update Event
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        Cancel
      </button>
    </div>

    <!-- Error Message for Duplicate Image -->
    <div *ngIf="showErrorMessage" class="error-message">
      Image already exists!
    </div>
  </form>
</div>
