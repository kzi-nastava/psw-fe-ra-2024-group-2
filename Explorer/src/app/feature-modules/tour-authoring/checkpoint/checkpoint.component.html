<div>
    <br>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Longitude</th>
                <th>Latitude</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let check of checkpoints">
                <td>{{check.name}}</td>
                <td>{{check.description}}</td>
                <td>{{check.longitude}}</td>
                <td>{{check.latitude}}</td>
            </tr>
        </tbody>
    </table>
</div>
