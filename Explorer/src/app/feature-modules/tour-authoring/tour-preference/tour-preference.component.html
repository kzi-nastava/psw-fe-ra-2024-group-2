<div class="main-container">
  <div class="preferences-content">
    <!-- Leva strana - forma za unos -->
    <div class="preference-form">
      <div class="preference-card">
        <div class="card-header">
          <h2>Add Tour Preference</h2>
        </div>
        
        <div class="card-content">
          <form [formGroup]="preferenceForm" (ngSubmit)="onSubmit()">
            <!-- Difficulty Level -->
            <div class="form-section">
              <label>Difficulty Level</label>
              <select class="form-select" formControlName="difficulty">
                <option *ngFor="let level of difficultyLevels" [value]="level">{{level}}</option>
              </select>
            </div>

            <!-- Transportation Preferences -->
            <div class="form-section">
              <label>Transportation Preferences</label>
              <div class="transport-grid">
                <div class="transport-item">
                  <div class="icon-box">👣</div>
                  <span>Walking</span>
                  <div class="rating-selector">
                    <div class="rating-circle" 
                         *ngFor="let rating of [1, 2, 3]; let i = index"
                         [class.active]="preferenceForm.get('walkRating')?.value >= rating"
                         (click)="setRating('walkRating', rating)">
                      {{rating}}
                    </div>
                    <div class="rating-clear" 
                         (click)="setRating('walkRating', 0)"
                         title="Clear rating">
                      ✕
                    </div>
                  </div>
                </div>

                <div class="transport-item">
                  <div class="icon-box">🚲</div>
                  <span>Bicycle</span>
                  <div class="rating-selector">
                    <div class="rating-circle" 
                         *ngFor="let rating of [1, 2, 3]; let i = index"
                         [class.active]="preferenceForm.get('bicycleRating')?.value >= rating"
                         (click)="setRating('bicycleRating', rating)">
                      {{rating}}
                    </div>
                    <div class="rating-clear" 
                         (click)="setRating('bicycleRating', 0)"
                         title="Clear rating">
                      ✕
                    </div>
                  </div>
                </div>

                <div class="transport-item">
                  <div class="icon-box">🚗</div>
                  <span>Car</span>
                  <div class="rating-selector">
                    <div class="rating-circle" 
                         *ngFor="let rating of [1, 2, 3]; let i = index"
                         [class.active]="preferenceForm.get('carRating')?.value >= rating"
                         (click)="setRating('carRating', rating)">
                      {{rating}}
                    </div>
                    <div class="rating-clear" 
                         (click)="setRating('carRating', 0)"
                         title="Clear rating">
                      ✕
                    </div>
                  </div>
                </div>

                <div class="transport-item">
                  <div class="icon-box">⛵</div>
                  <span>Boat</span>
                  <div class="rating-selector">
                    <div class="rating-circle" 
                         *ngFor="let rating of [1, 2, 3]; let i = index"
                         [class.active]="preferenceForm.get('boatRating')?.value >= rating"
                         (click)="setRating('boatRating', rating)">
                      {{rating}}
                    </div>
                    <div class="rating-clear" 
                         (click)="setRating('boatRating', 0)"
                         title="Clear rating">
                      ✕
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Tags -->
            <div class="form-section">
              <label>Interested Tags</label>
              <div class="tags-grid">
                <div class="tag-wrapper" *ngFor="let tag of availableTags">
                  <input type="checkbox" [id]="tag.id"
                         [checked]="isTagSelected(tag.name)"
                         (change)="toggleTag(tag.name)">
                  <label [for]="tag.id" class="tag-label">
                    {{tag.name}}
                  </label>
                </div>
              </div>
            </div>

            <button type="submit" class="submit-btn" [disabled]="!preferenceForm.valid">
              Save Preferences
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Desna strana - prikaz -->
    <div class="preference-display" *ngIf="currentPreferences">
      <div class="preference-card">
        <div class="card-header">
          <h2>Current Preferences</h2>
        </div>
        
        <div class="card-content">
          <div class="display-section">
            <label>Difficulty Level</label>
            <div class="difficulty-badge">
              {{currentPreferences.difficulty}}
            </div>
          </div>

          <div class="display-section">
            <label>Transport Ratings</label>
            <div class="transport-grid">
              <div class="rating-display" [class.has-rating]="currentPreferences.walkRating > 0">
                <div class="icon-box">👣</div>
                <span>Walking</span>
                <div class="rating-visual">
                  <div class="rating-dot" 
                       *ngFor="let rating of [1, 2, 3]"
                       [class.filled]="currentPreferences.walkRating >= rating">
                  </div>
                </div>
              </div>

              <div class="rating-display" [class.has-rating]="currentPreferences.bicycleRating > 0">
                <div class="icon-box">🚲</div>
                <span>Bicycle</span>
                <div class="rating-visual">
                  <div class="rating-dot" 
                       *ngFor="let rating of [1, 2, 3]"
                       [class.filled]="currentPreferences.bicycleRating >= rating">
                  </div>
                </div>
              </div>

              <div class="rating-display" [class.has-rating]="currentPreferences.carRating > 0">
                <div class="icon-box">🚗</div>
                <span>Car</span>
                <div class="rating-visual">
                  <div class="rating-dot" 
                       *ngFor="let rating of [1, 2, 3]"
                       [class.filled]="currentPreferences.carRating >= rating">
                  </div>
                </div>
              </div>

              <div class="rating-display" [class.has-rating]="currentPreferences.boatRating > 0">
                <div class="icon-box">⛵</div>
                <span>Boat</span>
                <div class="rating-visual">
                  <div class="rating-dot" 
                       *ngFor="let rating of [1, 2, 3]"
                       [class.filled]="currentPreferences.boatRating >= rating">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="display-section">
            <label>Selected Interests</label>
            <div class="selected-tags">
              <div class="tag-badge" *ngFor="let tag of currentPreferences.tags">
                {{tag}}
              </div>
              <div class="no-tags" *ngIf="!currentPreferences.tags?.length">
                No interests selected
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
