<div>
  <table>
    <th>
      <tr>Select Equipment</tr>
    </th>
    <tbody>
        <tr *ngFor="let equipment of equipmentsTotal">
          <td>
          <input 
            type="checkbox" 
            [value]="equipment.id" 
            [checked]="isEquipmentSelected(equipment.id)"
            (change)="onSelectEquipment($event, equipment)"/>

            <label>{{ equipment.name }}</label> 
            <label> - </label>
            <label>{{ equipment.description }}</label>
          </td>
        </tr>
    </tbody>
  </table>

    <br>
    <button style="margin-left: 4%;" color="primary" mat-raised-button (click)="updateTour()">Update Equipment</button>
</div>
<div>
  <xp-map id="map1" [objectCollection]="tourObjects" [checkpointCollection]="tourCheckpoints" [checkpointObjectCollection]="tourCheckpointObjects"></xp-map>
</div>
