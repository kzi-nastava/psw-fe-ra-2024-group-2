<div class="notification-dropdown">
  <div class="notification-header">
    <h3>Notifications</h3>
  </div>
  
  <div class="notification-list" (scroll)="onScroll($event)">
    <!-- Empty state -->
    <div *ngIf="notifications.length === 0 && coinNotifications.length === 0" 
         class="notification-empty">
      <p>No new notifications</p>
    </div>
    
    <!-- Regular notifications -->
    <div *ngFor="let notification of notifications" 
         class="notification-item" 
         (click)="goToNotification(notification)">
      <div class="notification-content">
        <div class="notification-title">From User: {{ notification.fromUserId }}</div>
        <div class="notification-badge" [ngClass]="{
          'badge-pending': notification.status === 'Pending',
          'badge-resolved': notification.status === 'Resolved',
          'badge-unresolved': notification.status === 'Unresolved'
        }">
          {{ notification.status }}
        </div>
      </div>
    </div>
    
    <!-- Coin notifications -->
    <div *ngFor="let coinNotification of coinNotifications" 
         class="notification-item">
      <div class="notification-content">
        <div class="notification-title">Adventure Coin Notification</div>
        <div class="notification-time">
          {{ coinNotification.sentAt | date:'short' }}
        </div>
      </div>
    </div>
  </div>

  <div class="notification-footer">
    <button class="mark-read-btn" (click)="MarkAllAsRead()">
      Mark all as read
    </button>
  </div>
</div>
