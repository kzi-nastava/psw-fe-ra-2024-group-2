<form [formGroup]="objectForm">
    <div>
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" formControlName="name" class="form-control" required/>
      </div>
  
      <!-- Description Field -->
      <div class="form-group">
        <label for="description">Description:</label>
        <textarea
          id="description"
          formControlName="description"
          rows="5"
          class="form-control"
        ></textarea>
      </div>
  
      <!-- Category Dropdown -->
      <div class="form-group">
        <label for="category">Category:</label>
        <select id="category" name="category" formControlName="category" class="form-control" required>
          <option value="0">WC</option>
          <option value="1">Restaurant</option>
          <option value="2">Parking</option>
        </select>
      </div>
  
      <!-- File Input for Image -->
      <div class="form-group">
        <label for="image-upload">Image:</label>
        <input type="file" id="image-upload" (change)="onFileSelect($event)" class="form-control" />
      </div>
  
      <!-- Image Preview -->
      <div *ngIf="imagePreview" class="image-preview-container">
        <label>Image Preview:</label>
        <img [src]="imagePreview" alt="Profile Image Preview" class="image-preview" />
      </div>
  
      <!-- Submit Button -->
      <div class="form-group">
        <button type="submit" class="btn btn-primary" (click)="addObject()">Add</button>
      </div>
    </div>
  </form>
