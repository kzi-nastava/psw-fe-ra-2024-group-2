<form [formGroup]="checkpointForm">
    <div>
        <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" type="text"/>
        </mat-form-field>
        
        <mat-form-field>
          <mat-label>Description</mat-label>
          <textarea matInput
          cdkTextareaAutosize
          cdkAutosizeMinRows="1"
          formControlName="description"
          cdkAutosizeMaxRows="5"></textarea>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Latitude</mat-label>
            <input matInput formControlName="latitude" type="number"/>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Longitude</mat-label>
            <input matInput formControlName="longitude" type="number"/>
        </mat-form-field>

        <!-- File input for image -->
        <div>
            <label for="image">Upload Image</label>
            <input type="file" id="image" (change)="onFileSelect($event)" accept="image/*">
        </div>

        <!-- Image preview -->
        <div *ngIf="imagePreview">
            <h4>Image Preview:</h4>
            <img [src]="imagePreview" alt="Image Preview" width="200">
        </div>

        <button mat-raised-button type="submit" color="primary" (click)="addCheckpoint()">Submit</button>
    </div>
</form>
