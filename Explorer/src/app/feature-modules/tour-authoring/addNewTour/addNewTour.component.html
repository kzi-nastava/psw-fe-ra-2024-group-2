<div class="page-container">
    <!-- Tour Form Section -->
    <section class="forms-section">
        <div class="form-container">
            <h2 class="form-title">Add New Tour</h2>
            <form [formGroup]="tourForm" class="custom-form" (ngSubmit)="addTour()">
                <div class="form-group">
                    <label for="tourName" class="form-label">Name</label>
                    <input type="text" id="tourName" class="input-field" placeholder="Enter tour name"
                        formControlName="name" required>
                </div>

                <div class="form-group">
                    <label for="tourDescription" class="form-label">Description</label>
                    <input type="text" id="tourDescription" class="input-field" placeholder="Enter tour description"
                        formControlName="description" required>
                </div>

                <div class="form-group">
                    <label for="difficulty" class="form-label">Difficulty</label>
                    <select id="difficulty" class="select-field" formControlName="difficulty" required>
                        <option value="0">Easy</option>
                        <option value="1">Moderate</option>
                        <option value="2">Hard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tag" class="form-label">Tag</label>
                    <select id="tag" class="select-field" formControlName="tag" required>
                        <option value="0">Adventure</option>
                        <option value="1">Relaxation</option>
                        <option value="2">Historical</option>
                        <option value="3">Cultural</option>
                        <option value="4">Nature</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-button">Add Tour</button>
                </div>
            </form>
        </div>
