<div class="navbar">
  <div class="navbar-container">
    <!-- Logo Section -->
    <div class="logo-section">
      <a href="/"><img src="../../../../assets/logo.png" alt="Logo" class="logo"></a>
    </div>

    <!-- Navigation Items -->
    <div class="nav-section">
      <div class="nav-item dropdown" (mouseover)="notificationsVisible = true"
        (mouseleave)="notificationsVisible = false" *ngIf="user && user.role === 'tourist' 
      || user && user.role ==='author'
      || user && user.role==='administrator'">
        <button class="dropdown-toggle">Notifications</button>
        <div class="dropdown-content">
          <app-notification *ngIf="notificationsVisible"></app-notification>
        </div>
      </div>

      <!-- Messaging Navigation -->
      <div class="nav-item dropdown" *ngIf="user && user.role === 'tourist' 
      || user && user.role ==='author'
      || user && user.role==='administrator'">
        <button class="dropdown-toggle">Messaging</button>
        <div class="dropdown-content">
          <button [routerLink]="['/profileMessaging/chat', user.id]">Send Message</button>
        </div>
      </div>

      <!-- Tourist Navigation -->
      <div class="nav-item dropdown" *ngIf="user && user.role === 'tourist'">
        <button class="dropdown-toggle">
          <span>Tours & Activities</span>
        </button>
        <div class="dropdown-content">
          <div class="dropdown-section">
            <h4 style="padding-top: 10px;">Browse</h4>
            <button (click)="showAllTours()">Browse Tours</button>
            <button (click)="showAllBundles()">Browse Bundles</button>
            <button (click)="showAllSouvenirs()">Browse Souvenirs</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>My Purchases</h4>
            <button (click)="showPurchasedTours()">Purchased Tours</button>
            <button (click)="showPurchasedSouvenirs()">Purchased Souvenirs</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Community & Events</h4>
            <button (click)="showClub()">Club</button>
            <button [routerLink]="['myclub']">My Club</button>
            <button (click)="showPopularEvents()">Popular Events</button>
            <button (click)="showCalendar()">Events Calendar</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Reports & Management</h4>
            <button [routerLink]="['tourReporting']">Report Tour</button>
            <button [routerLink]="['tourIssueReport']">Tour Reports</button>
            <button [routerLink]="['touristEquipment']">Equipment Evidence</button>
            <button [routerLink]="['tourPreference']">Tour Preferences</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Interactive</h4>
            <button (click)="showSimulator()">Simulator</button>
            <button (click)="showEncounterExecution()">Encounter Execution</button>
            <button *ngif="false" [routerLink]="['encounters']">Create Encounter</button>
          </div>
        </div>
      </div>

      <!-- Author Navigation -->
      <div class="nav-item dropdown" *ngIf="user && user.role === 'author'">
        <button class="dropdown-toggle">
          <span>Tour Management</span>
        </button>
        <div class="dropdown-content">
          <div class="dropdown-section">
            <h4 style="padding-top: 10px;">Create Content</h4>
            <button (click)="showAddNewTour()">Add Tour</button>
            <button (click)="showCreateBundle()">Add Bundle</button>
            <button (click)="showCreateSouvenir()">Add Souvenir</button>
            <button (click)="showAddNewEvent()">Add Event</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>My Inventory</h4>
            <button (click)="showMyTours()">My Tours</button>
            <button (click)="showMyBundles()">My Bundles</button>
            <button (click)="showMySouvenirs()">My Souvenirs</button>
            <button (click)="showMyEvents()">My Events</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Objects & Management</h4>
            <button (click)="showObjects()">Objects</button>
            <button (click)="showObjectsForUpdate()">Manage Objects</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Reporting & Analytics</h4>
            <button [routerLink]="['tourIssueReport']">Tour Reports</button>
            <button (click)="showEventAnalytics()">Event Analytics</button>
            <button (click)="showSales()">Sales</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Interactive</h4>
            <button [routerLink]="['encounters']">Create Encounter</button>
          </div>
        </div>
      </div>

      <!-- Admin Navigation -->
      <div class="nav-item dropdown" *ngIf="user && user.role === 'administrator'">
        <button class="dropdown-toggle">
          <span>Administration</span>
        </button>
        <div class="dropdown-content">
          <div class="dropdown-section">
            <h4 style="padding-top: 10px;">Resource Management</h4>
            <button [routerLink]="['equipment']">Manage Equipment</button>
            <button [routerLink]="['manageTouristFunds']">Manage Tourist Funds</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>User & Feedback</h4>
            <button [routerLink]="['account']">Manage Accounts</button>
            <button [routerLink]="['ratingsApplications']">All Ratings</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Reporting</h4>
            <button [routerLink]="['tourIssueReport']">Tour Reports</button>
          </div>
        </div>
      </div>

      <!-- User Menu -->
      <div class="nav-item dropdown" *ngIf="user && user.username !== ''">
        <button class="dropdown-toggle">
          <span>Basics</span>
        </button>
        <div class="dropdown-content">
          <div class="dropdown-section">
            <h4 style="padding-top: 10px;">My Account</h4>
            <button (click)="showProfile()">Profile</button>
            <button *ngIf="user.role === 'tourist'" [routerLink]="['mywallet']">My Wallet</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Content & Engagement</h4>
            <button (click)="showBlogs()">Blog</button>
            <button (click)="showComment()">Comment</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Support & Feedback</h4>
            <button *ngIf="user.role === 'tourist' || user.role === 'author'" [routerLink]="['rateApp']">Rate
              Application</button>
            <button [routerLink]="['faq']">FAQ</button>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-section">
            <h4>Account Actions</h4>
            <button (click)="onLogout()">Logout</button>
          </div>
        </div>
      </div>

      <div class="nav-item">
        <button [routerLink]="['']">Home</button>
      </div>

      <!-- Login Button -->
      <div class="nav-item" *ngIf="user && user.username === ''">
        <button class="login-btn" [routerLink]="['login']">Login</button>
      </div>

      <!-- Shopping Cart Button -->
      <div class="nav-item" *ngIf="user && user.role === 'tourist'">
        <button class="cart-btn" (click)="toggleShoppingCart()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cart4" viewBox="0 0 16 16">
            <path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l.5 2H5V5zM6 5v2h2V5zm3 0v2h2V5zm3 0v2h1.36l.5-2zm1.11 3H12v2h.61zM11 8H9v2h2zM8 8H6v2h2zM5 8H3.89l.5 2H5zm0 5a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Shopping Cart Sidebar -->
    <div class="cart-sidebar-container" [class.open]="isOpen">
      <xp-shopping-cart></xp-shopping-cart>
    </div>

  </div>
</div>
