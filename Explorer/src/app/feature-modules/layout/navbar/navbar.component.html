<div class="navbar">
  <div class="navbar-container">
    <!-- Logo Section -->
    <div class="logo-section">
      <a href="/"><img src="../../../../assets/logo.png" alt="Logo" class="logo"></a>
    </div>

    <!-- Navigation Items -->
    <div class="nav-section">
      <div class="nav-item dropdown" (mouseover)="notificationsVisible = true" (mouseleave)="notificationsVisible = false" 
      *ngIf="user && user.role === 'tourist' 
      || user && user.role ==='author'
      || user && user.role==='administrator'">
        <button class="dropdown-toggle">Notifications</button>
        <div class="dropdown-content">
          <app-notification *ngIf="notificationsVisible"></app-notification>
        </div>
      </div>

      <!-- Messaging Navigation -->
      <div class="nav-item dropdown" *ngIf="user && user.role === 'tourist' 
      || user && user.role ==='author'
      || user && user.role==='administrator'">
        <button class="dropdown-toggle">Messaging</button>
        <div class="dropdown-content">
          <button [routerLink]="['profileMessaging']">Send Message</button>
        </div>
      </div>

      <!-- Tourist Navigation -->
      <div class="nav-item dropdown" *ngIf="user && user.role === 'tourist'">
        <button class="dropdown-toggle">Tours & Activities</button>
        <div class="dropdown-content">
          <button (click)="showAllTours()">Browse Tours</button>
          <button (click)="showPurchasedTours()">Purchased Tours</button> 
          <button (click)="showClub()">Club</button>
          <button [routerLink]="['myclub']">My Club</button>
          <button [routerLink]="['tourReporting']">Report Tour</button>
          <button [routerLink]="['tourIssueReport']">Tour Reports</button>
          <button [routerLink]="['touristEquipment']">Equipment evidence</button>
          <button (click)="showSimulator()">Simulator</button>
          <button [routerLink]="['tourPreference']">Tour preference</button>     
          <button (click)="showPopularEvents()">Popular Events</button>        
        </div>
      </div>

      <!-- Author Navigation -->
      <div class="nav-item dropdown" *ngIf="user && user.role === 'author'">
        <button class="dropdown-toggle">Tour Management</button>
        <div class="dropdown-content">
          <button (click)="showAddNewTour()">Add Tour</button>
          <button (click)="showMyTours()">My Tours</button>
          <button (click)="showObjects()">Objects</button>
          <button (click)="showObjectsForUpdate()">Manage Objects</button>
          <button [routerLink]="['tourIssueReport']">Tour Reports</button>
          <button (click)="showAddEvent()">Add Event</button>
          <button (click)="showEventAnalytics()">Event analytics</button>
        </div>
      </div>

      <!-- Admin Navigation -->
      <div class="nav-item dropdown" *ngIf="user && user.role === 'administrator'">
        <button class="dropdown-toggle">Administration</button>
        <div class="dropdown-content">
          <button [routerLink]="['equipment']">Manage Equipment</button>
          <button [routerLink]="['ratingsApplications']">All Ratings</button>
          <button [routerLink]="['tourIssueReport']">Tour Reports</button>
          <button [routerLink]="['account']">Manage Accounts</button>
        </div>
      </div>

      <!-- User Menu -->
      <div class="nav-item dropdown" *ngIf="user && user.username !== ''">
        <button class="dropdown-toggle"> Basics </button>
        <div class="dropdown-content">
          <button (click)="showProfile()">Profile</button>
          <button (click)="showBlogs()">Blog</button>
          <button (click)="showComment()">Comment</button>
          <button *ngIf="user.role === 'tourist' || user.role === 'author'" [routerLink]="['rateApp']">
            Rate Application
          </button>
          <button [routerLink]="['faq']">FAQ</button>
          <div class="dropdown-divider"></div>
          <button (click)="onLogout()">Logout</button>
        </div>
      </div>

      <div class="nav-item">
        <button [routerLink]="['']">Home</button>
      </div>

      <!-- Login Button -->
      <div class="nav-item" *ngIf="user && user.username === ''">
        <button class="login-btn" [routerLink]="['login']">Login</button>
      </div>

      <!-- Shopping Cart Button -->
      <div class="nav-item" *ngIf="user && user.role === 'tourist'">
        <button class="cart-btn" (click)="toggleShoppingCart()">
          <i class="fa fa-shopping-cart"></i>
          <span class="icon">🛒</span>
        </button>
      </div>
    </div>

    <!-- Shopping Cart Sidebar -->
    <div class="cart-sidebar-container" [class.open]="isOpen">
      <xp-shopping-cart></xp-shopping-cart>
    </div>
    
  </div>
</div>
