<div class="container">
  <div class="centered-content">
    <div class="message-card">
      <h2 class="card-title">Send Message</h2>
      
      <form [formGroup]="messageForm" (ngSubmit)="onSubmit()">
        <!-- Recipient -->
        <div class="form-group">
          <label>Recipient</label>
          <select formControlName="recipientId" class="form-control">
            <option value="">Select recipient</option>
            <option *ngFor="let user of users" [ngValue]="user.id">
              {{user.username}}
            </option>
          </select>
        </div>

        <!-- Message -->
        <div class="form-group">
          <label>Message</label>
          <textarea 
            formControlName="text"
            class="form-control"
            placeholder="Type your message here..."
          ></textarea>
          <small class="char-limit">Maximum 280 characters</small>
        </div>

        <!-- Tour Link -->
        <div class="form-group">
          <label>Tour Link (optional)</label>
          <input 
            type="text" 
            formControlName="resource"
            class="form-control"
            placeholder="Add link to your tour..." 
          />
        </div>

        <!-- Submit Button -->
        <div class="form-action">
          <button type="submit" [disabled]="!messageForm.valid || loading">
            Send Message
          </button>
        </div>

        <div *ngIf="error" class="error-message">
          {{error}}
        </div>
      </form>
    </div>
  </div>
</div>
