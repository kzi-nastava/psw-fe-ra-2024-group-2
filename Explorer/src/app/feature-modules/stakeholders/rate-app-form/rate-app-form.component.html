<main class="rate-app-container">
  <h2 class="form-title">Rate our application!</h2>

  <form [formGroup]="rateAppForm" class="rate-app-form" (ngSubmit)="addRateApp()"
    aria-label="Forma za ocenjivanje aplikacije">
    <!-- Rating Input Group -->
    <div class="form-group">
      <label for="grade" class="form-label">
        Grade <span class="required" aria-hidden="true">*</span>
      </label>
      <input id="grade" type="number" formControlName="grade" class="input-field"
        [ngClass]="{'input-error': isFieldInvalid('grade')}" min="1" max="5" aria-describedby="gradeError" required />
      <div *ngIf="isFieldInvalid('grade')" class="error-message" id="gradeError" role="alert">
        Please enter a number between 1 and 5.
      </div>
    </div>

    <!-- Comment Input Group -->
    <div class="form-group">
      <label for="comment" class="form-label">Comment</label>
      <textarea id="comment" formControlName="comment" class="textarea-field" rows="4"
        placeholder="Type your comment here..." aria-label="Polje za komentar">
      </textarea>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-button" [disabled]="!rateAppForm.valid">
      <span>Submit</span>
    </button>
  </form>

  <!-- Feedback Messages -->
  <div class="feedback-container" role="status" aria-live="polite">
    <p *ngIf="result" class="result-message">{{ result }}</p>
    <p *ngIf="alreadyRate" class="already-rate-message">{{ alreadyRate }}</p>
  </div>
</main>
