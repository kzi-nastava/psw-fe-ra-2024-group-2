<div id="profile" class="profile-container mat-elevation-z4">
    <mat-card *ngIf="profile;">
        <mat-card-header>
            <mat-card-title>User Profile</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <div class="profile-info">
                <div class="info-item">
                    <label>Username:</label>
                    <input matInput [value]="profile.username" disabled />
                </div>
                <div class="info-item">
                    <label>Name:</label>
                    <input matInput [value]="profile.name" disabled />
                </div>
                <div class="info-item">
                    <label>Last Name:</label>
                    <input matInput [value]="profile.lastName" disabled />
                </div>
                <div class="info-item">
                    <label>Email:</label>
                    <input matInput [value]="profile.email" disabled />
                </div>
                <div *ngif="profile.biography" class="info-item">
                    <label>Biography:</label>
                    <textarea matInput [value]="profile.biography" disabled></textarea>
                </div>
                <div *ngif="profile.biography" class="info-item">
                    <label>Moto:</label>
                    <input matInput [value]="profile.moto" disabled />
                </div>
            </div>
            <div class="edit-button-container">
                <button mat-raised-button color="primary">Edit</button>
            </div>
        </mat-card-content>
    </mat-card>
</div>
