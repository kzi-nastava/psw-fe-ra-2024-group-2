<h2 mat-dialog-title class="dialog-title">Edit Profile</h2>

<mat-dialog-content>
  <form [formGroup]="profileForm" class="edit-profile-grid">
    
    <!-- Red 1: Username - Email -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

    <!-- Red 2: Name - Last Name -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName">
    </mat-form-field>

    <!-- Red 3: Biography (span 2) -->
    <mat-form-field appearance="fill" class="full-width biography-span">
      <mat-label>Biography</mat-label>
      <textarea matInput rows="4" formControlName="biography"></textarea>
    </mat-form-field>

    <!-- Red 4: Moto - Upload Image -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Moto</mat-label>
      <input matInput formControlName="moto">
    </mat-form-field>

    <div class="image-upload-block">
      <label for="image-upload">Profile Image</label>
      <input type="file" id="image-upload" (change)="onFileSelect($event)">

      <div *ngIf="imagePreview" class="image-preview-container">
        <label>Image Preview</label>
        <img [src]="imagePreview" alt="Profile Image Preview" class="image-preview" />
      </div>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button class="brown-button outlined" (click)="onCancel()">Cancel</button>
  <button mat-raised-button class="brown-button" (click)="onSave()">Save</button>
</mat-dialog-actions>
