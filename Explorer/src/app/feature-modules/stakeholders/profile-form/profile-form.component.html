<h2 mat-dialog-title>Edit Profile</h2>
<mat-dialog-content>
  <form [formGroup]="profileForm" class="edit-profile-form">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Biography</mat-label>
      <textarea matInput formControlName="biography"></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Moto</mat-label>
      <input matInput formControlName="moto">
    </mat-form-field>

    <!-- Flex container for the file input and image preview -->
    <div class="file-input-container">
      <div class="file-input">
        <label for="image-upload">Profile Image</label>
        <input type="file" id="image-upload" (change)="onFileSelect($event)">
      </div>

      <!-- Image Preview -->
      <div *ngIf="imagePreview" class="image-preview-container">
        <label>Image Preview</label>
        <img [src]="imagePreview" alt="Profile Image Preview" class="image-preview"/>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()">Save</button>
</mat-dialog-actions>
